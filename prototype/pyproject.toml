[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-gui-simulator"
version = "0.1.0"
description = "Windows desktop UI prototype for a device simulator"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6-Essentials==6.8.3", "openpyxl==3.1.5", "defusedxml==0.7.1"]

[project.scripts]
ds-simulator = "ds_simulator.app:main"

[tool.setuptools.packages.find]
where = ["src"]
