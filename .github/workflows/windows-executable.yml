name: Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/windows-executable.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            prototype/pyproject.toml
            prototype/packaging/requirements-build.txt
      - name: Install runtime and packaging tools
        run: python packaging/ci_check.py install -m pip install -e . -r packaging/requirements-build.txt
      - name: Run tests on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/ci_check.py tests -m unittest discover -s tests -v
      - name: Package and smoke-test the Windows executable
        run: python packaging/ci_check.py package packaging/build_windows.py
      - name: Retain executable and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DS-Simulator-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            prototype/dist/DS-Simulator.exe
            prototype/dist/DS-Simulator.exe.sha256
            prototype/dist/validation/

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DS-Simulator-Windows-x64
          path: release-files
      - name: Publish the tested prototype executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: prototype-windows-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cat > release-notes.md <<'EOF'
          Windows x64 TCP/UDP 통신 시험 프로그램입니다. Python 설치 없이 사용할 수 있습니다.

          `DS-Simulator.exe` 파일 하나만 다운로드하여 더블클릭하세요.
          ZIP 압축 해제, Python 설치, 추가 폴더, CMD 파일이 필요하지 않습니다.

          Windows에서 전체 테스트와 EXE만 임시 폴더에 복사한 상태에서 화면·가상 Excel ICD 가져오기·실제 IPv4 루프백 TCP 서버/클라이언트 및 UDP 양방향 바이트 검사를 통과한 빌드입니다.
          실제 통신 모드에서 연결 설정을 편집하고 HEX/UTF-8 직접 송신을 사용하세요. 수신 원문은 로그에 기록됩니다. 모의 모드도 별도로 선택할 수 있습니다.
          Excel ICD는 선택한 `(데이터)` 시트에서 A·B로 메시지를 구분하고 C~K는 고정 정의, M은 줄바꿈 구분 선택값으로 읽습니다. 표에서 M열만 변경할 수 있습니다.
          실제 장치의 ICD 자동 인코딩/디코딩에는 헤더 20바이트의 배치·필드 길이·타입·엔디언·프레이밍·체크섬 규격이 필요합니다.
          TX 기록은 송신 대기/운영체제 접수 상태이며 상대 장치의 수신·정상 동작 판정이 아닙니다. 계측기 제어·FFT·10G 성능 검증은 미구현입니다.
          수식 셀은 Excel이 마지막으로 계산해 저장한 결과를 읽습니다. 결과가 없으면 Excel에서 전체 재계산(Ctrl+Alt+F9) 후 저장하고 다시 가져오세요.
          EOF
          gh release create "$RELEASE_TAG" \
            release-files/DS-Simulator.exe \
            release-files/DS-Simulator.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "DS Simulator standalone EXE (${GITHUB_SHA:0:7})" \
            --notes-file release-notes.md \
            --prerelease --latest=false
